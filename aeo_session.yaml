# AEO Session — Static YAML
# Variables passed via --env flags:
#   PLATFORM_URL    → target AI platform URL
#   PLATFORM_NAME   → name to search e.g. "Gemini AI", "ChatGPT", "Perplexity AI"
#   PLATFORM_DOMAIN → domain shown in search result e.g. "gemini.google.com"
#   PROMPT          → the seeding prompt text
#   FOLLOW_UP       → follow-up prompt (empty string if none)
#   DEVICE_ID       → device identifier for logging

appId: com.android.chrome
---
# Launch Chrome fresh — clear state every session
- launchApp:
    clearState: true

# Dismiss any first-run Chrome dialogs
- tapOn:
    text: "Use without an account"
    optional: true
- tapOn:
    text: "Got it"
    optional: true
- tapOn:
    text: "Stay signed out"
    optional: true

- waitForAnimationToEnd

# Tap the address/search bar
- tapOn:
    text: ^Search.*
- waitForAnimationToEnd

# Type the platform name as a Google search — like a real user
- inputText: "${PLATFORM_NAME}"
- pressKey: Enter
- waitForAnimationToEnd

# If sponsored result is showing, swipe past it then tap the organic result
- runFlow:
    when:
      visible: "Sponsored result"
    commands:
      # Now the actual swipe + tap
      - swipe:
          start: 50%, 75%
          end: 50%, 25%
      - waitForAnimationToEnd
      - tapOn:
          text: "Google Gemini"
          optional: false
      - waitForAnimationToEnd
      - tapOn:
          point: 50%, 35%
          

# If no sponsored result, tap directly
- runFlow:
    when:
      notVisible: "Sponsored result"
    commands:
      - tapOn:
          text: "${PLATFORM_URL}"   # ← was ${PLATFORM_URL}, keep consistent
      - waitForAnimationToEnd

# Dismiss banners/popups
- tapOn:
    text: "No thanks"
    optional: true
# - tapOn:
#     text: "Dismiss"
#     optional: true
# - tapOn:
#     id: "close-button"
#     optional: true
# - tapOn:
#     text: "Got it"
#     optional: true
# - tapOn:
#     text: "Not now"
#     optional: true

- waitForAnimationToEnd

# Type and send the seeding prompt
- inputText: "${PROMPT}"
- tapOn:
    text: "Send Message"
- waitForAnimationToEnd

# Scroll through the AI response — simulates human reading
- repeat:
    times: 5
    commands:
      - scroll
      - waitForAnimationToEnd

# ── Follow-up (only runs if FOLLOW_UP is not empty) ──────────────────────────
- runFlow:
    when:
      true: ${FOLLOW_UP !== ""}
    commands:
      - tapOn:
          text: ^Ask.*
          optional: true
      - inputText: "${FOLLOW_UP}"
      - tapOn:
          text: "Send Message"
      - repeat:
          times: 5
          commands:
            - scroll
            - waitForAnimationToEnd
